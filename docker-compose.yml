# Docker Compose untuk pengembangan aplikasi perencanaan anggaran gaji.
# Cara pakai: salin .env.example -> .env, isi DB_PASSWORD, lalu `docker compose up --build`.
services:
  app:
    build: ./docker/php
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-anggaran_gaji}
      DB_USERNAME: ${DB_USERNAME:-anggaran}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    image: nginx:alpine
    ports:
      # Hanya localhost; akses dari luar via SSH tunnel
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [internal]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-anggaran_gaji}
      POSTGRES_USER: ${DB_USERNAME:-anggaran}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-anggaran}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
